<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../static/css/idol.css" th:href="@{/css/idol.css}">
    <title>アイドル管理アプリ</title>
</head>
<body>
    <h1>新規加入アイドル入力画面</h1>
    <form method="post" action="index.html" th:action="@{/idol/join}" th:object="${idolForm}">
        <table>
            <tbody>
                <tr>
                    <th>名前</th>
                    <td>
                        <input type="text" th:field="*{name}">
                        <div th:errors="*{name}" class="error" ></div>
                    </td>
                </tr>
                <tr>
                    <th>誕生日</th>
                    <td>
                        <input type="date" th:field="*{birthday}">
                        <div th:errors="*{birthday}" class="error" ></div>
                    </td>
                </tr>
                <tr>
                    <th>血液型</th>
                    <td>
                        <select th:field="*{bloodType}">
                            <option value="">(未指定)</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="O">O</option>
                            <option value="AB">AB</option>
                            <option value="UNKNOWN">UNKNOWN</option>
                        </select>
                        <div th:errors="*{bloodType}" class="error" ></div>
                    </td>
                </tr>
            </tbody>
        </table>
        <button>新規加入</button>
    </form>
</body>
</html>
